  /admin/analytics/engagement:
    get:
      tags: [Администрирование]
      summary: 'Аналитика: длительность визита и вовлечённость'
      description: >-
        Длительность считается по ВИЗИТАМ: поток событий сессии режется по
        неактивности дольше SESSION_TIMEOUT_MINUTES (30 минут). Вкладка,
        открытая утром и ожившая через четыре часа, даёт два визита, а не один
        на четыре часа, и расчёт не зависит от того, дошёл ли `session_end`.


        Кроме длительности: сколько экспонатов посмотрели и вопросов задали за
        визит и какая доля дошла до диалога с гидом. Знаменатель конверсий —
        визиты с `app_open`; пока фронт его не шлёт, берутся все визиты.
      operationId: getAnalyticsEngagement
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Начало периода (ISO-8601 дата), включительно.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: to
          in: query
          description: >-
            Конец периода (ISO-8601 дата), ВКЛЮЧИТЕЛЬНО: from=2026-07-01&to=2026-07-31
            отдаёт и события 31 июля. До 03.08.2026 граница была исключающей, и
            последний день периода молча терялся.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-31'
      responses:
        '200':
          description: Длительность сессий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEngagement'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/analytics/routes:
    get:
      tags: [Администрирование]
      summary: 'Аналитика: маршрут по залам, точки выхода, повторные визиты'
      description: >-
        Маршруты по залам из событий hall_view внутри визита: посещения, точки
        входа, переходы A→B, частые пути.


        Точки выхода: `top_exit_halls` — последний зал визита,
        `top_exit_screens` — тип последнего содержательного события (часть
        посетителей уходит из чата, а не из зала).


        Повторные визиты считаются по анонимному `device_id`, а не по
        `session_id` (тот живёт в sessionStorage, новая вкладка = новый
        «человек»). Сессии без `device_id` расчёт не ломают — считаются
        одиночными устройствами.
      operationId: getAnalyticsRoutes
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Начало периода (ISO-8601 дата), включительно.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: to
          in: query
          description: >-
            Конец периода (ISO-8601 дата), ВКЛЮЧИТЕЛЬНО: from=2026-07-01&to=2026-07-31
            отдаёт и события 31 июля. До 03.08.2026 граница была исключающей, и
            последний день периода молча терялся.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-31'
        - name: limit
          in: query
          description: Максимум элементов в топах маршрута.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Маршрут пользователя по залам.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsRoutes'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/analytics/unanswered:
    get:
      tags: [Администрирование]
      summary: 'Аналитика: вопросы, на которые гид не смог ответить'
      description: >-
        Показывает, чего не хватает в описаниях экспонатов. Признак `answered` и
        причина отказа проставляются в момент генерации ответа: `no_context` —
        не было справки, `llm_refusal` — модель отказалась при наличии
        материалов, `not_found` — экспонат не найден в каталоге, `error` — сбой
        LLM.


        Вопросы сгруппированы тем же кластеризатором, что и
        /admin/analytics/questions, и привязаны к экспонатам из контекста
        запроса. Сообщения, накопленные до 03.08.2026, признака не имеют и
        попадают в `unclassified` (разовый бэкфилл —
        `scripts/backfill_unanswered.py`).
      operationId: getAnalyticsUnanswered
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Начало периода (ISO-8601 дата), включительно.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: to
          in: query
          description: >-
            Конец периода (ISO-8601 дата), ВКЛЮЧИТЕЛЬНО: from=2026-07-01&to=2026-07-31
            отдаёт и события 31 июля. До 03.08.2026 граница была исключающей, и
            последний день периода молча терялся.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-31'
        - name: limit
          in: query
          description: Максимум кластеров в выдаче.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Вопросы без ответа, сгруппированные по смыслу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsUnanswered'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/analytics/exhibits:
    get:
      tags: [Администрирование]
      summary: 'Аналитика: статистика по экспонатам'
      description: >-
        Просмотры, вопросы гиду, озвучки и распознавания по каждому экспонату.
        Список строится от каталога (exhibits LEFT JOIN events), поэтому
        экспонат, которого никто не открывал, присутствует в выдаче с
        `views: 0` — из одних events такие «мёртвые» карточки не выводятся.
      operationId: getAnalyticsExhibits
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Начало периода (ISO-8601 дата), включительно.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: to
          in: query
          description: >-
            Конец периода (ISO-8601 дата), ВКЛЮЧИТЕЛЬНО: from=2026-07-01&to=2026-07-31
            отдаёт и события 31 июля. До 03.08.2026 граница была исключающей, и
            последний день периода молча терялся.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-31'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
        - name: order
          in: query
          description: >-
            views — топ по просмотрам; questions — топ по вопросам к ИИ-гиду
            (это не то же самое); asc — от наименее просматриваемых.
          required: false
          schema:
            type: string
            enum: [views, questions, asc]
            default: views
      responses:
        '200':
          description: Статистика по экспонатам.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExhibits'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

