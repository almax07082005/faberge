      tags: [Администрирование]
      summary: 'Аналитика: пересчитать агрегаты вручную'
      description: >-
        Пересчитывает суточный срез и прогревает кэш всех отчётов за период —
        чтобы не ждать ночного джоба при отладке и демонстрации. Идемпотентно:
        повторный запуск за ту же дату перезаписывает строки, а не удваивает
        цифры. То же самое из cron: `python scripts/rebuild_analytics.py`.
      operationId: rebuildAnalytics
      security:
        - bearerAuth: []
