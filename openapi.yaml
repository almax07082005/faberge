              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/analytics/questions:
    get:
      tags: [Администрирование]
      summary: 'Аналитика: частые и редкие вопросы'
      description: >-
        Реплики посетителей, сгруппированные ПО СМЫСЛУ: «Сколько стоит яйцо?»,
        «какая цена яйца» и «Сколько это стоит» попадают в один кластер.
        У кластера есть представитель (`question` — самая частая формулировка),
        `variants` (другие формулировки) и суммарный `count`.


        `rare` — кластеры не чаще ANALYTICS_RARE_MAX_COUNT раз; с `frequent`
        они не пересекаются.
      operationId: getAnalyticsQuestions
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Начало периода (ISO-8601 дата), включительно.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: to
          in: query
          description: >-
            Конец периода (ISO-8601 дата), ВКЛЮЧИТЕЛЬНО: from=2026-07-01&to=2026-07-31
            отдаёт и события 31 июля. До 03.08.2026 граница была исключающей, и
            последний день периода молча терялся.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-31'
        - name: limit
          in: query
          description: Максимум вопросов в каждой коллекции (частые/редкие).
