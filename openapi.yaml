          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: LLM не настроен.

  /admin/analytics/overview:
    get:
      tags: [Администрирование]
      summary: '[Вне MVP] Сводная аналитика'
      description: >-
        Агрегированные показатели использования за период: сессии,
        распознавания, доля успешных распознаваний, сообщения в чате,
        прослушивания аудио, топ экспонатов и залов.


        Отдаётся из кэша агрегатов: реалтайм по ТЗ не требуется, данные
        обновляются раз в сутки ночным джобом. Время пересчёта — в `updated_at`.
      operationId: getAnalyticsOverview
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Начало периода (ISO-8601 дата), включительно.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: to
          in: query
          description: >-
            Конец периода (ISO-8601 дата), ВКЛЮЧИТЕЛЬНО: from=2026-07-01&to=2026-07-31
            отдаёт и события 31 июля. До 03.08.2026 граница была исключающей, и
            последний день периода молча терялся.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-31'
        - name: limit
          in: query
          description: Размер топов экспонатов и залов.
          required: false
