  /admin/analytics/export:
    get:
      tags: [Администрирование]
      summary: 'Аналитика: выгрузка отчёта в .xlsx / .pdf'
      description: >-
        Отдаёт отчёт файлом за тем же Bearer, что и остальная админка.
        `.xlsx` — один лист на отчёт, числа числами (музей сводит их в Excel
        формулами). `.pdf` — таблицы с шапкой периода и датой формирования.


        Кириллица в PDF требует TTF-шрифта: путь задаётся переменной окружения
        ANALYTICS_PDF_FONT_PATH либо файл кладётся в assets/fonts/DejaVuSans.ttf.
        Без шрифта эндпоинт возвращает 503, а не лист с квадратами.


        Имя файла — `faberge-<report>-<from>-<to>.<ext>`.
      operationId: exportAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: report
          in: query
          required: true
          schema:
            type: string
            enum: [overview, questions, unanswered, exhibits, routes, recognition]
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [xlsx, pdf]
            default: xlsx
        - name: from
          in: query
          description: Начало периода (ISO-8601 дата), включительно.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: to
          in: query
          description: >-
            Конец периода (ISO-8601 дата), ВКЛЮЧИТЕЛЬНО: from=2026-07-01&to=2026-07-31
            отдаёт и события 31 июля. До 03.08.2026 граница была исключающей, и
            последний день периода молча терялся.
          required: false
          schema:
            type: string
            format: date
          example: '2026-07-31'
      responses:
        '200':
          description: Файл отчёта.
          headers:
            Content-Disposition:
              description: attachment; filename="faberge-<report>-<from>-<to>.<ext>"
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: >-
            Выгрузка недоступна: не установлена библиотека (openpyxl/reportlab)
            либо не найден шрифт с кириллицей для PDF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ───────────────────────────── Телеметрия ──────────────────────────────
  /telemetry/events:
    post:
      tags: [Телеметрия]
      summary: Отправить события
      description: >-
        Пакетный приём анонимных пользовательских событий — источник данных для
        административной аналитики. С 21.07.2026 — обязательная часть контракта:
        без событий GET /admin/analytics/engagement и /analytics/routes пусты (B11).


        Контракт с 03.08.2026:

        * не более 50 событий в батче, иначе 422;

        * событие с типом вне словаря НЕ роняет батч — оно отбрасывается,
        остальные записываются, число отброшенных возвращается в `rejected`;

        * устаревший `audio_play` нормализуется в канонический `tts_play`;

        * в `props` сохраняются только ключи из контракта события, остальные
        (в т.ч. user_agent, ip, url, geo) отбрасываются; `props.text` длиннее
        500 символов обрезается.


        Приватность: IP и User-Agent запроса не читаются и не сохраняются —
        ни в events, ни в логи (docs/analytics-privacy.md).
      operationId: ingestEvents
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '202':
          description: События приняты в обработку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventIngestResult'
              example:
                accepted: 9
                rejected: 1
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Статический Bearer-токен администратора (получается через
        `POST /admin/login`). Слать в заголовке `Authorization: Bearer <token>`
        ко всем эндпоинтам `/admin/**` (кроме `/admin/login`).

  parameters:
    Limit:
      name: limit
      in: query
      description: Максимум элементов на странице.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Смещение от начала выборки (постраничность).
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    IsTemporary:
      name: is_temporary
      in: query
      required: false
      description: >-
        Фильтр по типу экспозиции: `true` — временные (сменные) выставки,
        `false` — основная (постоянная) экспозиция. Без параметра возвращаются
        и те и другие. Для экспонатов признак берётся от зала (через витрину).
      schema:
        type: boolean
      example: true
    IncludeService:
      name: include_service
      in: query
      required: false
      description: >-
        Включить служебные залы (`is_service`: Парадная лестница и т.п.). По
        умолчанию `false` — посетителю такие записи не показываются. `true`
        нужен админке, чтобы служебный зал оставался управляемым.
      schema:
        type: boolean
        default: false
      example: false
    HallId:
      name: hall_id
      in: path
      required: true
      description: Идентификатор зала.
      schema:
        type: integer
        minimum: 1
      example: 5
    ShowcaseId:
      name: showcase_id
      in: path
      required: true
      description: Идентификатор витрины.
      schema:
        type: integer
        minimum: 1
      example: 12
    ExhibitId:
      name: exhibit_id
      in: path
      required: true
      description: Идентификатор экспоната.
      schema:
        type: integer
        minimum: 1
      example: 101
    LabelSlug:
      name: label_slug
      in: path
      required: true
      description: Стабильный slug класса от YOLO.
      schema:
        type: string
        pattern: '^[a-z0-9_]+$'
      example: faberge_egg_coronation

  responses:
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Экспонат не найден.
    BadRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Не удалось прочитать изображение.
    Unauthorized:
      description: Требуется авторизация администратора.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Not authenticated
    Conflict:
      description: Конфликт уникальности (например, дубль `label_slug` или номера).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Экспонат с таким label_slug уже существует.
    PayloadTooLarge:
      description: Файл превышает допустимый размер (10 МБ).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Размер файла превышает 10 МБ.
    UnsupportedMediaType:
      description: Неподдерживаемый формат файла.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Поддерживаются только JPEG, PNG и WebP.
    UnprocessableEntity:
      description: Ошибка валидации запроса (формат FastAPI).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
    UpstreamError:
      description: >-
        Ошибка внешнего сервиса (YOLO / YandexGPT / SpeechKit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Сервис распознавания временно недоступен.

  schemas:
    # ── Системное ──
    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        version:
          type: string
          example: 0.1.0-mvp
        time:
          type: string
          format: date-time
          example: '2026-05-30T10:00:00Z'
        dependencies:
          type: object
          description: Доступность внешних зависимостей.
          additionalProperties:
            type: string
            enum: [up, down]
          example:
            postgres: up
            object_storage: up
            yolo: up
            yandexgpt: up
            speechkit: up

    # ── Залы ──
    Hall:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          example: 5
        hall_number:
          type: integer
          nullable: true
          description: >-
            Номер зала на плане экспозиции (уникальный). `null` — у зала номера
            нет («Вне постоянной экспозиции»): подпись строится только из
            названия, без «зал № …». Такие залы выводятся последними.
          example: 5
        name:
          type: string
          nullable: true
          example: Синяя гостиная
        description:
          type: string
          nullable: true
          description: >-
            Описание зала для уровня зала на карте и для контекста ИИ-гида.
            Наполняется из плана экспозиции и путеводителя.
          example: >-
            Парадная гостиная Шуваловского дворца, где представлены девять
            императорских пасхальных яиц Фаберже.
        level:
          type: integer
          nullable: true
          description: Этаж / уровень в здании музея.
          example: 2
        cover_image_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.cloud/halls/blue/cover.jpg
        is_temporary:
          type: boolean
          default: false
          description: >-
            Зал временной (сменной) выставки. `true` — временная выставка,
            `false` — основная (постоянная) экспозиция. Основа для тега/фильтра
            «Временная выставка» в каталоге и переключателя в админке.
          example: false
        is_service:
          type: boolean
          default: false
          description: >-
            Служебная запись каталога (Парадная лестница и т.п.). Такие залы не
            попадают ни в `GET /halls`, ни на карту, ни в ответы гида — увидеть
            их можно только с `?include_service=true` (нужно админке).
          example: false
        sort_order:
          type: integer
          default: 0
          description: Порядок вывода в каталоге/админке (drag-n-drop).
          example: 0
        showcase_count:
          type: integer
          nullable: true
          example: 6
        exhibit_count:
          type: integer
          nullable: true
          example: 24

    HallBrief:
      type: object
      description: Краткая ссылка на зал (для вложений в карточку экспоната).
      required: [id]
      properties:
        id:
          type: integer
          example: 5
        hall_number:
          type: integer
          nullable: true
          description: '`null` — зал без номера («Вне постоянной экспозиции»).'
          example: 5
        name:
          type: string
          nullable: true
          example: Синяя гостиная

    HallDetail:
      allOf:
        - $ref: '#/components/schemas/Hall'
        - type: object
          properties:
            showcases:
              type: array
              description: Витрины зала (могут включаться по необходимости).
              items:
                $ref: '#/components/schemas/Showcase'

    MapHall:
      allOf:
        - $ref: '#/components/schemas/Hall'
        - type: object
          properties:
            showcases:
              type: array
              items:
                $ref: '#/components/schemas/Showcase'

    MapResponse:
      type: object
      required: [halls]
      properties:
        halls:
          type: array
          items:
            $ref: '#/components/schemas/MapHall'

    HallListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Hall'
        total:
          type: integer
          example: 12
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    # ── Витрины ──
    Showcase:
      type: object
      required: [id, hall_id]
      properties:
        id:
          type: integer
          example: 12
        hall_id:
          type: integer
          example: 5
        showcase_number:
          type: integer
          nullable: true
          description: >-
            Номер витрины внутри зала (уникален в пределах зала). `null` —
            группа «не в витринах»: в путеводителе она отмечена пустым
            квадратом, это экспонаты зала вне витрин. Такая группа в зале одна
            (попытка завести вторую → `409`) и выводится последней.
          example: 3
        name:
          type: string
          nullable: true
          example: Императорские пасхальные яйца
        exhibit_count:
          type: integer
          nullable: true
          example: 4

    ShowcaseBrief:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          example: 12
        showcase_number:
          type: integer
          nullable: true
          description: '`null` — экспонат стоит вне витрин.'
          example: 3

    ShowcaseDetail:
      allOf:
        - $ref: '#/components/schemas/Showcase'
        - type: object
          properties:
            hall:
              $ref: '#/components/schemas/HallBrief'
            exhibits:
              type: array
              items:
                $ref: '#/components/schemas/ExhibitSummary'

    ShowcaseListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Showcase'
        total:
          type: integer
          example: 6
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    # ── Экспонаты ──
    Image:
      type: object
      required: [id, url]
      properties:
        id:
          type: integer
          description: Идентификатор фото в галерее (для DELETE /admin/exhibits/{id}/media/{image_id}).
          example: 1
        url:
          type: string
          format: uri
          example: https://cdn.example.cloud/exhibits/coronation/main.jpg
        alt:
          type: string
          nullable: true
          example: Коронационное яйцо, общий вид
        width:
          type: integer
          nullable: true
          example: 1600
        height:
          type: integer
          nullable: true
          example: 1600
        is_primary:
          type: boolean
          default: false
          description: Главное фото экспоната (= exhibits.image_url).
          example: true

    ExhibitSummary:
      type: object
      description: Краткое представление экспоната для списков и карусели.
      required: [id, name]
      properties:
        id:
          type: integer
          example: 101
        exhibit_number:
          type: string
          nullable: true
          description: >-
            Номер экспоната по путеводителю музея (B3). Показывается перед
            названием в каталоге. Строка — в путеводителе бывают номера вида «12а».
          example: '12'
        label_slug:
          type: string
          nullable: true
          example: faberge_egg_coronation
        name:
          type: string
          example: Яйцо «Коронационное»
        year_created:
          type: integer
          nullable: true
          example: 1897
        master_name:
          type: string
          nullable: true
          example: Михаил Перхин
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.cloud/exhibits/coronation/thumb.jpg
        hall_id:
          type: integer
          nullable: true
          example: 5
        showcase_id:
          type: integer
          nullable: true
          example: 12
        showcase_number:
          type: integer
          nullable: true
          description: >-
            Номер витрины экспоната (`null` — вне витрин). Отдаётся прямо в
            списке, чтобы группировку «витрина → её экспонаты» можно было
            собрать из одного ответа `GET /halls/{hall_id}/exhibits`.
          example: 3
        is_temporary:
          type: boolean
          nullable: true
          description: >-
            Признак временной выставки, унаследованный от зала экспоната
            (через витрину → зал). Позволяет показать бейдж «Временная выставка»
            в карточке каталога.
          example: false

    Exhibit:
      type: object
      description: >-
        Полная карточка экспоната для публичного API. Внутреннее поле
        `raw_history` сюда не включается.
      required: [id, name]
      properties:
        id:
          type: integer
          example: 101
        exhibit_number:
          type: string
          nullable: true
          description: Номер экспоната по путеводителю музея (B3), показывается перед названием.
          example: '12'
        label_slug:
          type: string
          nullable: true
          description: Класс, который возвращает YOLO.
          example: faberge_egg_coronation
        name:
          type: string
          example: Яйцо «Коронационное»
        year_created:
          type: integer
          nullable: true
          example: 1897
        master_name:
          type: string
          nullable: true
          example: Михаил Перхин
        material:
          type: string
          nullable: true
          example: Золото, гильоше-эмаль, бриллианты, рубины
        short_description:
          type: string
          nullable: true
          example: >-
            Пасхальное яйцо-сюрприз, подаренное Николаем II императрице
            Александре Фёдоровне в память о коронации 1896 года.
        image_url:
          type: string
          format: uri
          nullable: true
          description: Главное изображение (Object Storage + CDN).
          example: https://cdn.example.cloud/exhibits/coronation/main.jpg
        images:
          type: array
          description: Галерея изображений (публичная, B4/C22).
          items:
            $ref: '#/components/schemas/Image'
        video_url:
          type: string
          format: uri
          nullable: true
          description: Видео экспоната, если есть (B4/C22).
          example: https://cdn.example.cloud/exhibits/coronation/video.mp4
        model_3d_url:
          type: string
          format: uri
          nullable: true
          description: Ссылка на 3D-модель Koinovo.
          example: https://koinovo.ru/fabergemuseum/coronation
        model_3d_embed:
          type: string
          nullable: true
          description: HTML/iframe embed-код 3D-модели (когда предоставит Koinovo).
        audio_url:
          type: string
          format: uri
          nullable: true
          description: Предсинтезированная озвучка краткого описания (если есть).
        source_url:
          type: string
          format: uri
          nullable: true
          description: Первоисточник описания на сайте музея.
          example: https://fabergemuseum.ru/kollekczii/shedevryi-kollekczii/
        hall:
          $ref: '#/components/schemas/HallBrief'
        showcase:
          $ref: '#/components/schemas/ShowcaseBrief'

    ExhibitListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExhibitSummary'
        total:
          type: integer
          example: 24
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    # ── Поиск ──
    SearchResponse:
      type: object
      required: [query, halls, exhibits]
      properties:
        query:
          type: string
          example: коронационное
        halls:
          type: array
          items:
            $ref: '#/components/schemas/Hall'
        exhibits:
          type: array
          items:
            $ref: '#/components/schemas/ExhibitSummary'
        total:
          type: integer
          description: Суммарное число найденных объектов.
          example: 1

    # ── Распознавание ──
    RecognitionCandidate:
      type: object
      required: [label_slug, confidence]
      properties:
        label_slug:
          type: string
          example: faberge_egg_winter
        name:
          type: string
          nullable: true
          example: Яйцо «Зимнее»
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.41
        exhibit_id:
          type: integer
          nullable: true
          description: >-
            Идентификатор карточки экспоната, чтобы выбор кандидата вёл на карточку,
            а не в чат (B5/E19). `null`, если для класса нет экспоната в каталоге.
          example: 102
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: Миниатюра кандидата (= exhibits.image_url) для показа в списке (B5/E19).
          example: https://cdn.example.cloud/exhibits/winter/thumb.jpg

    RecognitionResponse:
      type: object
      required: [recognized]
      properties:
        recognized:
          type: boolean
          description: Распознан ли экспонат с уверенностью выше порога.
          example: true
        label_slug:
          type: string
          nullable: true
          example: faberge_egg_coronation
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          example: 0.94
        exhibit:
          allOf:
            - $ref: '#/components/schemas/Exhibit'
          nullable: true
          description: Найденная карточка (если распознано), иначе `null`.
        candidates:
          type: array
          description: Вероятные классы при неуверенном распознавании.
          items:
            $ref: '#/components/schemas/RecognitionCandidate'
        request_id:
          type: string
          format: uuid
          description: Идентификатор запроса для трассировки.
          example: 7b1c0e2a-9f3d-4a2b-8c10-2a4d6e8f0a11
        processing_ms:
          type: integer
          nullable: true
          example: 312

    # ── ИИ-гид ──
    GuideStyle:
      type: string
      description: Стиль генерируемого рассказа.
      enum: [engaging, historical, short, kids, expert]
      default: engaging

    GuideContext:
      type: object
      description: >-
        Контекст диалога. Укажите хотя бы одно из полей. `exhibit_id`/`label_slug`
        — контекст экспоната, `hall_id` — контекст зала.
      properties:
        exhibit_id:
          type: integer
          nullable: true
          example: 101
        label_slug:
          type: string
          nullable: true
          example: faberge_egg_coronation
        hall_id:
          type: integer
          nullable: true
          example: 5

    StoryRequest:
      type: object
      description: 'Запрос на генерацию рассказа. Укажите `exhibit_id` или `label_slug`.'
      properties:
        exhibit_id:
          type: integer
          nullable: true
          example: 101
        label_slug:
          type: string
          nullable: true
          example: faberge_egg_coronation
        style:
          $ref: '#/components/schemas/GuideStyle'
        language:
          type: string
          default: ru
          description: Язык рассказа (ISO-639-1).
          example: ru
        include_audio:
          type: boolean
          default: false
          description: Сразу синтезировать озвучку и вернуть `audio_url`.
        max_questions:
          type: integer
          minimum: 0
          maximum: 6
          default: 4
          description: Сколько вопросов-подсказок сгенерировать (по ТЗ — 3–4).

    StoryResponse:
      type: object
      required: [text, suggested_questions]
      properties:
        exhibit_id:
          type: integer
          nullable: true
          example: 101
        label_slug:
          type: string
          nullable: true
          example: faberge_egg_coronation
        style:
          $ref: '#/components/schemas/GuideStyle'
        text:
          type: string
          description: Сгенерированный YandexGPT рассказ.
        suggested_questions:
          type: array
          description: 3–4 контекстных вопроса-подсказки для продолжения диалога.
          items:
            type: string
          example:
            - Сколько времени ушло на создание?
            - Кому подарили это яйцо?
            - Что за сюрприз спрятан внутри?
        audio_url:
          type: string
          format: uri
          nullable: true
          description: Озвучка рассказа, если запрошен `include_audio`.
        model:
          type: string
          nullable: true
          example: yandexgpt/latest
        generated_at:
          type: string
          format: date-time
          nullable: true

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
          example: user
        content:
          type: string
          example: Кому подарили это яйцо?

    ChatRequest:
      type: object
      required: [message]
      properties:
        session_id:
          type: string
          format: uuid
          nullable: true
          description: Идентификатор диалога. Если не задан — сервер создаст новый.
          example: 2f6a9b3c-1d4e-4f8a-9c2b-5e7a1d0c3b66
        context:
          allOf:
            - $ref: '#/components/schemas/GuideContext'
          nullable: true
          description: >-
            Экспонат/зал, рядом с которым находится посетитель. Поведение
            зависит от того, передано ли поле:
            поле **не передано** — сервер подставит контекст, сохранённый в
            сессии (продолжение разговора);
            `{}` или `null` — **сброс**: контекст сессии очищается, вопрос
            трактуется как общий (вход в общий чат с главного экрана);
            заполненный объект — заменяет контекст сессии целиком.
        reset_context:
          type: boolean
          default: false
          description: >-
            Явный сброс контекста без передачи самого `context` — для входа в
            общий чат, когда клиент переиспользует прежний `session_id`.
          example: false
        message:
          type: string
          minLength: 1
          description: Сообщение пользователя (часто — одна из подсказок).
          example: Кому подарили это яйцо?
        history:
          type: array
          description: Опциональная история сообщений (если не используется session_id).
          items:
            $ref: '#/components/schemas/ChatMessage'
        language:
          type: string
          default: ru
          example: ru
        max_questions:
          type: integer
          minimum: 0
          maximum: 6
          default: 3

    ChatResponse:
      type: object
      required: [session_id, answer, suggested_questions]
      properties:
        session_id:
          type: string
          format: uuid
          example: 2f6a9b3c-1d4e-4f8a-9c2b-5e7a1d0c3b66
        answer:
          type: string
        suggested_questions:
          type: array
          items:
            type: string
        context:
          $ref: '#/components/schemas/GuideContext'
        referenced_exhibits:
          type: array
          description: >-
            Экспонаты, на которые ссылается ответ (B6/C23) — фронт рисует плашки
            со ссылкой на карточку (компонент exhibit-plaque). Пусто, если ответ
            ни на что конкретное не ссылается.
          items:
            $ref: '#/components/schemas/ReferencedExhibit'
        referenced_halls:
          type: array
          description: Залы структурой (B10/C25) — когда вопрос про список залов.
          items:
            $ref: '#/components/schemas/ReferencedHall'
        location:
          allOf:
            - $ref: '#/components/schemas/GuideLocation'
          nullable: true
          description: Где искать экспонат (B7/C24) — заполняется на навигационный вопрос.

    ReferencedExhibit:
      type: object
      description: Плашка экспоната в ответе гида (B6) со ссылкой на карточку.
      required: [id, name]
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: Яйцо «Коронационное»
        exhibit_number:
          type: string
          nullable: true
          example: '12'
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.cloud/exhibits/coronation/thumb.jpg
        hall_number:
          type: integer
          nullable: true
          example: 3
        showcase_number:
          type: integer
          nullable: true
          example: 2

    ReferencedHall:
      type: object
      description: Структурированный зал в ответе гида (B10).
      required: [id]
      properties:
        id:
          type: integer
          example: 3
        hall_number:
          type: integer
          nullable: true
          description: '`null` — зал без номера («Вне постоянной экспозиции»).'
          example: 3
        name:
          type: string
          nullable: true
          example: Синяя гостиная

    GuideLocation:
      type: object
      description: Навигационный ответ «зал + витрина» (B7).
      properties:
        hall_number:
          type: integer
          nullable: true
          example: 3
        hall_name:
          type: string
          nullable: true
          example: Синяя гостиная
        showcase_number:
          type: integer
          nullable: true
          example: 2

    # ── Озвучивание ──
    SpeechVoice:
      type: string
      description: Голос Yandex SpeechKit.
      enum: [alena, filipp, jane, omazh, zahar, ermil]
      default: alena

    AudioFormat:
      type: string
      enum: [mp3, oggopus, wav]
      default: mp3

    SpeechRequest:
      type: object
      description: 'Запрос синтеза речи. Укажите `text` или `exhibit_id`.'
      properties:
        text:
          type: string
          nullable: true
          description: Текст для озвучивания.
        exhibit_id:
          type: integer
          nullable: true
          description: Озвучить краткое описание экспоната.
          example: 101
        voice:
          $ref: '#/components/schemas/SpeechVoice'
        format:
          $ref: '#/components/schemas/AudioFormat'
        speed:
          type: number
          format: float
          minimum: 0.1
          maximum: 3.0
          default: 1.0
          example: 1.0
        emotion:
          type: string
          enum: [neutral, good, evil]
          default: neutral

    SpeechResponse:
      type: object
      required: [audio_url, format, voice]
      properties:
        audio_url:
          type: string
          format: uri
          example: https://cdn.example.cloud/tts/coronation_alena.mp3
        format:
          $ref: '#/components/schemas/AudioFormat'
        voice:
          $ref: '#/components/schemas/SpeechVoice'
        duration_ms:
          type: integer
          nullable: true
          example: 21400
        characters:
          type: integer
          nullable: true
          description: Сколько символов синтезировано (для учёта квот SpeechKit).
          example: 248
        cached:
          type: boolean
          nullable: true
          description: Отдано ли аудио из кэша Object Storage.
          example: true

    # ── Администрирование ──
    HallCreate:
      type: object
      properties:
        hall_number:
          type: integer
          nullable: true
          description: >-
            Номер зала. `null` — зал без номера («Вне постоянной экспозиции»):
            в подписях выводится только название.
          example: 5
        name:
          type: string
          nullable: true
          example: Синяя гостиная
        description:
          type: string
          nullable: true
        level:
          type: integer
          nullable: true
          example: 2
        is_temporary:
          type: boolean
          default: false
          description: Отметить зал как временную выставку (переключатель в админке).
          example: false
        is_service:
          type: boolean
          default: false
          description: >-
            Служебная запись: зал остаётся в каталоге, но исчезает из публичной
            выдачи (`GET /halls`, карта, ответы гида).
          example: false
        sort_order:
          type: integer
          nullable: true
          description: >-
            Порядок вывода в каталоге/админке (drag-n-drop). Если не указан,
            ставится hall_number (а для зала без номера — конец списка).
          example: 5

    HallPatch:
      type: object
      description: Частичное обновление зала — переданы только изменяемые поля.
      properties:
        hall_number:
          type: integer
          nullable: true
          description: >-
            Явный `null` убирает номер зала (зал остаётся в каталоге и
            показывается по названию).
          example: 5
        name:
          type: string
          nullable: true
          example: Синяя гостиная
        description:
          type: string
          nullable: true
        level:
          type: integer
          nullable: true
          example: 2
        cover_image_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.cloud/halls/blue/cover.jpg
        is_temporary:
          type: boolean
          nullable: true
          description: Переключатель «Временная выставка» для зала.
          example: true
        is_service:
          type: boolean
          nullable: true
          description: >-
            Переключатель «служебная запись»: скрывает зал из публичной выдачи,
            не удаляя его и не трогая привязанные экспонаты.
          example: true
        sort_order:
          type: integer
          nullable: true
          description: Порядок вывода в каталоге/админке (drag-n-drop).
          example: 5

    HallReorderRequest:
      type: object
      description: >-
        id залов в желаемом порядке (drag-n-drop); залы переставляются в рамках
        своих текущих позиций.
      required: [hall_ids]
      properties:
        hall_ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [3, 1, 2]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: admin

    LoginResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: Bearer-токен администратора (слать в Authorization ко всем /admin/**).
          example: dev-admin-token
        token_type:
          type: string
          default: bearer
          example: bearer

    ShowcaseCreate:
      type: object
      required: [hall_id]
      properties:
        hall_id:
          type: integer
          example: 5
        showcase_number:
          type: integer
          nullable: true
          description: >-
            Номер витрины по путеводителю. `null` — группа «не в витринах»
            (пустой квадрат в путеводителе); в зале она одна, попытка завести
            вторую → `409`.
          example: 3
        name:
          type: string
          nullable: true

    ShowcasePatch:
      type: object
      description: >-
        Частичное обновление витрины (B2/E14) — все поля необязательны. Контракт
        совпадает с updateShowcase() во фронтовом lib/api/admin.ts.
      properties:
        hall_id:
          type: integer
          description: Перенести витрину в другой зал.
          example: 5
        showcase_number:
          type: integer
          nullable: true
          description: >-
            Номер витрины. Явный `null` превращает витрину в группу
            «не в витринах» (в зале допустима одна такая, иначе `409`).
          example: 3
        name:
          type: string
          nullable: true

    ExhibitCreate:
      type: object
      required: [showcase_id, name]
      properties:
        showcase_id:
          type: integer
          example: 12
        exhibit_number:
          type: string
          nullable: true
          description: Номер экспоната по путеводителю музея (B3).
          example: '12'
        label_slug:
          type: string
          nullable: true
          pattern: '^[a-z0-9_]+$'
          example: faberge_egg_winter
        name:
          type: string
          example: Яйцо «Зимнее»
        year_created:
          type: integer
          nullable: true
          example: 1913
        master_name:
          type: string
          nullable: true
          example: Альма Пиль
        material:
          type: string
          nullable: true
          example: Горный хрусталь, платина, бриллианты
        short_description:
          type: string
          nullable: true
        short_description_spoken:
          type: string
          nullable: true
          description: >-
            Ручное переопределение версии short_description для озвучки
            (числа прописью). Если не передано — генерится LLM из
            short_description.
        raw_history:
          type: string
          nullable: true
          description: >-
            Внутренние факты для генерации рассказа LLM. Рекомендуется хранить
            буллитами или в JSON. Через публичный API не отдаётся.
          example: >-
            Заказчик — Николай II. Подарок императрице Марии Фёдоровне.
            Дизайн — Альма Пиль. Горный хрусталь и бриллианты. Сюрприз —
            корзина подснежников.
        image_url:
          type: string
          format: uri
          nullable: true
        video_url:
          type: string
          format: uri
          nullable: true
          description: Видео экспоната (B4/C22).
        model_3d_url:
          type: string
          format: uri
          nullable: true

    ExhibitUpdate:
      allOf:
        - $ref: '#/components/schemas/ExhibitCreate'
      description: Полная замена полей экспоната (PUT).

    ExhibitPatch:
      type: object
      description: Частичное обновление — все поля необязательны.
      properties:
        showcase_id:
          type: integer
        exhibit_number:
          type: string
          nullable: true
          description: Номер экспоната по путеводителю музея (B3).
        label_slug:
          type: string
          pattern: '^[a-z0-9_]+$'
        name:
          type: string
        year_created:
          type: integer
          nullable: true
        master_name:
          type: string
          nullable: true
        material:
          type: string
          nullable: true
        short_description:
          type: string
          nullable: true
        short_description_spoken:
          type: string
          nullable: true
          description: >-
            Ручное переопределение версии short_description для озвучки
            (числа прописью). Если не передано — генерится LLM из
            short_description.
        raw_history:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        video_url:
          type: string
          format: uri
          nullable: true
          description: Видео экспоната (B4/C22).
        model_3d_url:
          type: string
          format: uri
          nullable: true

    ExhibitAdmin:
      allOf:
        - $ref: '#/components/schemas/Exhibit'
      description: Админское представление — включает внутреннее `raw_history`.
      properties:
        raw_history:
          type: string
          nullable: true
          example: >-
            Заказчик — Николай II. Подарок императрице Марии Фёдоровне.
        short_description_spoken:
          type: string
          nullable: true
          description: >-
            Версия short_description для озвучки: числа прописью в нужном
            падеже (LLM); фронту отдаётся short_description с цифрами.

    MediaUploadResponse:
      type: object
      required: [image_id, image_url, object_key]
      properties:
        image_id:
          type: integer
          description: Id созданной записи галереи (для DELETE /admin/exhibits/{id}/media/{image_id}).
          example: 4
        image_url:
          type: string
          format: uri
          example: https://cdn.example.cloud/exhibits/winter/main.jpg
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: Сейчас совпадает с image_url — отдельная миниатюра не генерируется.
          example: https://cdn.example.cloud/exhibits/winter/main.jpg
        object_key:
          type: string
          description: Ключ объекта в Yandex Object Storage.
          example: exhibits/winter/main.jpg

    AnalyticsTopItem:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: >-
            null у элементов без сущности в каталоге — например, у «экранов
            выхода» (top_exit_screens), где значимо только имя типа события.
          example: 101
        name:
          type: string
          example: Яйцо «Коронационное»
        count:
          type: integer
          example: 187

    AnalyticsOverview:
      type: object
      properties:
        from:
          type: string
          format: date
          nullable: true
          example: '2026-05-25'
        to:
          type: string
          format: date
          nullable: true
          example: '2026-06-25'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Время последнего пересчёта агрегатов. Фронт показывает «данные на
            03.08.2026 04:00» — иначе отсутствие сегодняшних цифр выглядит как
            поломка дашборда.
          example: '2026-08-03T04:00:00Z'
        total_sessions:
          type: integer
          example: 1240
        total_app_opens:
          type: integer
          default: 0
          description: Число открытий приложения (событие app_open).
          example: 1500
        total_recognitions:
          type: integer
          example: 980
        recognition_success_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.86
        total_chat_messages:
          type: integer
          example: 3450
        total_audio_plays:
          type: integer
          example: 1120
        top_exhibits:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsTopItem'
        top_halls:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsTopItem'

    AnalyticsQuestionItem:
      type: object
      description: Смысловая группа вопросов (кластер), а не отдельная формулировка.
      required: [question, count]
      properties:
        question:
          type: string
          description: Представитель кластера — самая частая формулировка.
          example: Кому подарили это яйцо?
        count:
          type: integer
          description: Суммарно по кластеру.
          example: 42
        variants:
          type: array
          description: >-
            Другие формулировки того же смысла (до 5) — музею важно видеть, КАК
            спрашивают.
          items:
            type: string
          example: ['кому его подарили', 'для кого сделали яйцо']

    AnalyticsQuestions:
      type: object
      description: >-
        Вопросы посетителей (агрегат по guide_messages, role=user),
        сгруппированные ПО СМЫСЛУ: «Сколько стоит яйцо?», «какая цена яйца» и
        «Сколько это стоит» попадают в один кластер.
      properties:
        from:
          type: string
          nullable: true
          example: '2026-05-25'
        to:
          type: string
          nullable: true
          example: '2026-06-25'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-03T04:00:00Z'
        total_questions:
          type: integer
          default: 0
          description: Всего реплик посетителей.
          example: 3450
        unique_questions:
          type: integer
          default: 0
          description: Различных формулировок (до кластеризации).
          example: 512
        total_clusters:
          type: integer
          default: 0
          description: Смысловых групп вопросов.
          example: 84
        frequent:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsQuestionItem'
        rare:
          type: array
          description: >-
            Кластеры, встретившиеся не чаще ANALYTICS_RARE_MAX_COUNT раз.
            С frequent не пересекаются.
          items:
            $ref: '#/components/schemas/AnalyticsQuestionItem'

    AnalyticsDurationBucket:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
          example: 1–3 мин
        count:
          type: integer
          example: 320

    AnalyticsEngagement:
      type: object
      description: >-
        Длительность ВИЗИТА и вовлечённость. Поток событий сессии режется по
        неактивности дольше SESSION_TIMEOUT_MINUTES (30 минут), поэтому вкладка,
        открытая утром и ожившая через четыре часа, даёт два визита, а не один
        на четыре часа — и расчёт не зависит от того, дошёл ли session_end.
      properties:
        from:
          type: string
          nullable: true
          example: '2026-05-25'
        to:
          type: string
          nullable: true
          example: '2026-06-25'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-03T04:00:00Z'
        total_sessions:
          type: integer
          default: 0
          description: Различных session_id за период.
          example: 1240
        avg_duration_sec:
          type: number
          default: 0
          example: 214.5
        median_duration_sec:
          type: number
          default: 0
          example: 180
        max_duration_sec:
          type: number
          default: 0
          example: 1820
        total_visits:
          type: integer
          default: 0
          description: Визитов после разбиения сессий по таймауту (≥ total_sessions).
          example: 1310
        avg_events_per_session:
          type: number
          default: 0
          example: 7.3
        avg_exhibits_per_session:
          type: number
          default: 0
          description: Среднее число уникальных exhibit_view за визит.
          example: 4.1
        avg_questions_per_session:
          type: number
          default: 0
          description: Среднее число chat_message за визит.
          example: 1.2
        sessions_with_chat:
          type: integer
          default: 0
          description: Визитов хотя бы с одним chat_open.
          example: 410
        sessions_with_questions:
          type: integer
          default: 0
          description: Визитов хотя бы с одним chat_message.
          example: 320
        sessions_with_app_open:
          type: integer
          default: 0
          description: >-
            Знаменатель конверсий. Если app_open не приходил ни разу (фронт ещё
            не шлёт), знаменателем становится total_visits.
          example: 1300
        chat_conversion_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0
          description: Доля визитов, дошедших до экрана чата с гидом.
          example: 0.32
        question_conversion_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0
          description: Доля визитов, в которых задали хотя бы один вопрос.
          example: 0.25
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDurationBucket'

    AnalyticsRouteHall:
      type: object
      required: [id, count]
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          nullable: true
          example: Синяя гостиная
        count:
          type: integer
          example: 187

    AnalyticsRouteTransition:
      type: object
      required: [from_hall_id, to_hall_id, count]
      properties:
        from_hall_id:
          type: integer
          example: 5
        from_hall_name:
          type: string
          nullable: true
          example: Синяя гостиная
        to_hall_id:
          type: integer
          example: 6
        to_hall_name:
          type: string
          nullable: true
          example: Золотая гостиная
        count:
          type: integer
          example: 96

    AnalyticsRoutePath:
      type: object
      required: [count]
      properties:
        halls:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRouteHall'
        count:
          type: integer
          example: 54

    AnalyticsSessionsPerDeviceBucket:
      type: object
      required: [label, devices]
      properties:
        label:
          type: string
          example: 3+ визита
        devices:
          type: integer
          example: 42

    AnalyticsRoutes:
      type: object
      description: >-
        Маршрут по залам, точки выхода и повторные визиты. Последовательность
        залов строится из событий hall_view внутри одного визита.
      properties:
        from:
          type: string
          nullable: true
          example: '2026-05-25'
        to:
          type: string
          nullable: true
          example: '2026-06-25'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-03T04:00:00Z'
        total_sessions_with_route:
          type: integer
          default: 0
          example: 980
        avg_halls_per_session:
          type: number
          default: 0
          example: 3.4
        top_hall_visits:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRouteHall'
        top_entry_halls:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRouteHall'
        top_transitions:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRouteTransition'
        top_paths:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRoutePath'
        top_exit_halls:
          type: array
          description: Залы, на которых чаще всего заканчивается визит (последний hall_view).
          items:
            $ref: '#/components/schemas/AnalyticsRouteHall'
        top_exit_screens:
          type: array
          description: >-
            Тип последнего содержательного события визита. Часть посетителей
            уходит из чата или с экрана распознавания, а не из зала, поэтому
            одних «залов выхода» недостаточно. У элементов id = null.
          items:
            $ref: '#/components/schemas/AnalyticsTopItem'
        total_devices:
          type: integer
          default: 0
          description: >-
            Устройств за период. Сессии без device_id (данные до 03.08.2026,
            приватный режим браузера) считаются одиночными устройствами.
          example: 860
        returning_devices:
          type: integer
          default: 0
          description: Устройств с двумя и более сессиями.
          example: 120
        avg_sessions_per_device:
          type: number
          default: 0
          example: 1.4
        sessions_per_device_hist:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSessionsPerDeviceBucket'

    # ── Аналитика: вопросы без ответа гида ──
    AnalyticsUnansweredItem:
      type: object
      required: [question, count]
      properties:
        question:
          type: string
          description: Представитель кластера — самая частая формулировка.
          example: Что спрятано внутри яйца?
        count:
          type: integer
          example: 17
        variants:
          type: array
          items:
            type: string
        fail_reasons:
          type: object
          description: Сколько раз сработала каждая причина отказа.
          additionalProperties:
            type: integer
          example: {no_context: 12, llm_refusal: 5}
        exhibits:
          type: array
          description: >-
            Экспонаты, у карточек которых задавали эти вопросы — там и не
            хватает описания.
          items:
            $ref: '#/components/schemas/AnalyticsTopItem'

    AnalyticsUnanswered:
      type: object
      description: >-
        Вопросы, на которые гид не смог ответить. Признак проставляется в момент
        генерации ответа, а не постфактум: отличить содержательный ответ от
        вежливого отказа по тексту в БД уже невозможно.
      properties:
        from:
          type: string
          nullable: true
          example: '2026-05-25'
        to:
          type: string
          nullable: true
          example: '2026-06-25'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-03T04:00:00Z'
        total_unanswered:
          type: integer
          default: 0
          example: 210
        total_answered:
          type: integer
          default: 0
          example: 3240
        unanswered_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0
          description: Доля среди вопросов с проставленным признаком.
          example: 0.061
        unclassified:
          type: integer
          default: 0
          description: >-
            Вопросы без признака (накоплены до 03.08.2026). В расчёт доли не
            входят; разовый бэкфилл — scripts/backfill_unanswered.py.
          example: 480
        fail_reasons:
          type: object
          additionalProperties:
            type: integer
          example: {no_context: 150, llm_refusal: 40, not_found: 15, error: 5}
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsUnansweredItem'

    # ── Аналитика: статистика по экспонатам ──
    AnalyticsExhibitRow:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          nullable: true
          example: Яйцо «Коронационное»
        hall_number:
          type: integer
          nullable: true
          example: 3
        views:
          type: integer
          default: 0
          example: 187
        questions:
          type: integer
          default: 0
          description: Число chat_message с этим exhibit_id.
          example: 34
        tts_plays:
          type: integer
          default: 0
          example: 55
        recognitions:
          type: integer
          default: 0
          example: 12

    AnalyticsExhibits:
      type: object
      description: >-
        Список строится ОТ каталога (exhibits LEFT JOIN events), поэтому
        экспонат, которого никто не открывал, присутствует с views = 0 — из
        одних events такие «мёртвые» карточки не выводятся.
      properties:
        from:
          type: string
          nullable: true
          example: '2026-05-25'
        to:
          type: string
          nullable: true
          example: '2026-06-25'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-03T04:00:00Z'
        order:
          type: string
          enum: [views, questions, asc]
          default: views
        total_exhibits:
          type: integer
          default: 0
          example: 340
        never_viewed:
          type: integer
          default: 0
          description: Экспонатов без единого просмотра за период.
          example: 96
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsExhibitRow'

    # ── Аналитика: качество распознавания ──
    AnalyticsRecognition:
      type: object
      description: >-
        Успешность распознавания, частота фолбэка с топ-3 кандидатов и поведение
        после неудачи. Считается одним проходом по событиям визита.
      properties:
        from:
          type: string
          nullable: true
          example: '2026-05-25'
        to:
          type: string
          nullable: true
          example: '2026-06-25'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-03T04:00:00Z'
        total:
          type: integer
          default: 0
          example: 980
        success:
          type: integer
          default: 0
          example: 843
        success_rate:
          type: number
          format: float
          default: 0
          example: 0.86
        fallback_shown:
          type: integer
          default: 0
          description: Показов топ-3 кандидатов (props.fallback = true).
          example: 96
        fallback_rate:
          type: number
          format: float
          default: 0
          example: 0.098
        fallback_converted:
          type: integer
          default: 0
          description: >-
            После фолбэка открыли карточку экспоната из кандидатов
            (exhibit_view с props.source = recognition).
          example: 61
        fallback_conversion_rate:
          type: number
          format: float
          default: 0
          example: 0.635
        failed:
          type: integer
          default: 0
          example: 137
        abandoned_after_fail:
          type: integer
          default: 0
          description: >-
            После неудачи в визите не было ни одного события, кроме session_end.
            Повторная съёмка и открытие экспоната руками уходом не считаются.
          example: 24
        abandonment_rate:
          type: number
          format: float
          default: 0
          example: 0.175
        retry_after_fail:
          type: integer
          default: 0
          example: 58
        avg_confidence:
          type: number
          format: float
          default: 0
          example: 0.81

    # ── Аналитика: суточный срез и пересчёт ──
    AnalyticsDailyPoint:
      type: object
      required: [date, metric]
      properties:
        date:
          type: string
          format: date
          example: '2026-08-02'
        metric:
          type: string
          example: events_by_type
        dimension_key:
          type: string
          description: Разрез метрики; пусто — метрика без разреза.
          default: ''
          example: exhibit_view
        dimension_id:
          type: integer
          nullable: true
          example: 101
        value:
          type: number
          default: 0
          example: 187

    AnalyticsDailySeries:
      type: object
      properties:
        from:
          type: string
          nullable: true
          example: '2026-07-01'
        to:
          type: string
          nullable: true
          example: '2026-07-31'
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-03T04:00:00Z'
        points:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDailyPoint'

    AnalyticsRebuildResult:
      type: object
      required: [updated_at]
      properties:
        rebuilt_reports:
          type: array
          items:
            type: string
          example: [overview, questions, unanswered, engagement, routes, exhibits, recognition]
        daily_days:
          type: integer
          default: 0
          description: За сколько суток пересчитан плоский срез.
          example: 2
        daily_rows:
          type: integer
          default: 0
          example: 1840
        updated_at:
          type: string
          format: date-time
          example: '2026-08-03T04:00:00Z'

    # ── Телеметрия ──
    Event:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >-
            Тип события из словаря контракта. `audio_play` — устаревший
            псевдоним, бэкенд нормализует его в канонический `tts_play`.
            Событие с типом вне словаря ОТБРАСЫВАЕТСЯ поштучно и попадает в
            `rejected`; остальные события батча записываются.
          enum:
            - app_open
            - hall_view
            - showcase_view
            - exhibit_view
            - recognition
            - chat_open
            - chat_message
            - tts_play
            - search_query
            - session_end
            - audio_play
          example: exhibit_view
        exhibit_id:
          type: integer
          nullable: true
        hall_id:
          type: integer
          nullable: true
        showcase_id:
          type: integer
          nullable: true
          description: Витрина, с которой пришло событие (showcase_view, exhibit_view из витрины).
        label_slug:
          type: string
          nullable: true
        device_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Анонимный постоянный идентификатор устройства (localStorage) — нужен
            только для метрики повторных визитов. Если не задан на событии,
            берётся из батча. Ни с чем персональным не связывается.
        ts:
          type: string
          format: date-time
          nullable: true
          description: >-
            Момент ДЕЙСТВИЯ (проставляет фронт), а не момент отправки батча.
            Если не прислан — проставит БД.
        props:
          type: object
          nullable: true
          description: >-
            Специфика события. Сохраняются ТОЛЬКО ключи из контракта, остальные
            отбрасываются на приёме (белый список, см. docs/analytics-privacy.md):
            app_open — entry, qr_id; exhibit_view — source; recognition —
            recognized, confidence, fallback, candidates_count, retry;
            chat_message — text; search_query — text, results_count;
            session_end — reason, last_screen. `props.text` длиннее 500 символов
            обрезается. `recognition.retry` — повторная съёмка после неудачной
            попытки; по нему считается `retry_after_fail` в отчёте.
          additionalProperties: true
          example: {source: hall}

    EventBatch:
      type: object
      required: [events]
      properties:
        session_id:
          type: string
          format: uuid
          nullable: true
          description: Случайный UUID сессии (sessionStorage), генерируется на клиенте.
        device_id:
          type: string
          format: uuid
          nullable: true
          description: Значение device_id по умолчанию для всех событий батча.
        events:
          type: array
          minItems: 1
          maxItems: 50
          description: >-
            Не более 50 событий за раз: эндпоинт открыт без авторизации, объём
            записи ограничен. Батч большего размера отклоняется с 422.
          items:
            $ref: '#/components/schemas/Event'

    EventIngestResult:
      type: object
      properties:
        accepted:
          type: integer
          default: 0
          description: Сколько событий записано.
          example: 9
        rejected:
          type: integer
          default: 0
          description: Сколько отброшено из-за неизвестного `type`.
          example: 1

    # ── Ошибки (формат FastAPI) ──
    Error:
      type: object
      description: Стандартная ошибка приложения (FastAPI `HTTPException`).
      required: [detail]
      properties:
        detail:
          type: string
          example: Экспонат не найден.

    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          example: [body, message]
        msg:
          type: string
          example: field required
        type:
          type: string
          example: value_error.missing

    HTTPValidationError:
      type: object
      description: Ошибка валидации запроса в формате FastAPI.
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
