          description: Экспонат удалён.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/exhibits/{exhibit_id}/media:
    get:
      tags: [Администрирование]
      summary: Список фото экспоната (галерея)
      description: >-
        Возвращает галерею экспоната. У каждого фото есть `id` (для
        `DELETE .../media/{image_id}`) и `is_primary` (какое фото главное).
      operationId: listExhibitMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExhibitId'
      responses:
        '200':
          description: Галерея экспоната.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Администрирование]
      summary: Загрузить фото экспоната
      description: >-
        Загрузка изображения экспоната (`multipart/form-data`: поле `file`,
        опционально `is_primary`). Лимиты: размер ≤ `MAX_UPLOAD_MB` (по
        умолчанию 10 МБ), форматы JPEG / PNG / WebP. Ответ содержит `image_id`
        для последующего `DELETE .../media/{image_id}`. `thumbnail_url` сейчас
        совпадает с `image_url` — отдельная миниатюра не генерируется.
      operationId: uploadExhibitMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExhibitId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Изображение (JPEG/PNG/WebP, ≤ MAX_UPLOAD_MB МБ).
                is_primary:
                  type: boolean
                  default: false
                  description: Сделать это изображение главным в карточке (= exhibits.image_url).
      responses:
        '201':
          description: Файл загружен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /admin/exhibits/{exhibit_id}/media/{image_id}:
    delete:
      tags: [Администрирование]
      summary: Удалить фото экспоната
      description: >-
        Удаляет изображение из галереи экспоната и сам объект из Object Storage.
        Если удаляется главное изображение, ссылка снимается с карточки.
      operationId: deleteExhibitMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExhibitId'
        - name: image_id
